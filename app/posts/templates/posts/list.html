{% extends "base.html" %}

{% block title %}Posts{% endblock %}

{% block content %}
  <h1>Posts</h1>

  <p>
    <a href="{{ url_for('posts.create_post') }}">Add new post</a>
  </p>

  <ul>
    {% for post in posts %}
      <li>
        <a href="{{ url_for('posts.post_detail', post_id=post.id) }}">
          {{ post.title }}
        </a>
        — by {{ post.author.username if post.author else "N/A" }}
      </li>
    {% else %}
      <li>No posts yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
