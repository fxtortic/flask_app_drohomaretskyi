{% extends "base.html" %}

{% block content %}
<div class="post-detail">
  <h1>{{ post.title }}</h1>

  <p class="post-meta">
    Категорія: {{ post.category }},
    автор: {{ post.author }},
    опубліковано: {{ post.posted.strftime('%Y-%m-%d %H:%M') }}
  </p>

  <div class="post-content">
    <p>{{ post.content }}</p>
  </div>

  <p>
    <a href="{{ url_for('posts.index') }}" class="btn-primary">
      ← Повернутися до списку
    </a>
  </p>
</div>
{% endblock %}
