{% extends "base.html" %}
{% from "partials/_render_field.html" import render_field %}

{% block content %}
<h1>Контактна форма</h1>

<form method="post" action="{{ url_for('contact') }}" class="contact-form">
    {{ form.hidden_tag() }}

    {{ render_field(form.name) }}
    {{ render_field(form.email) }}
    {{ render_field(form.topic) }}
    {{ render_field(form.message) }}

    <button type="submit" class="btn-primary">{{ form.submit.label.text }}</button>
</form>
{% endblock %}
